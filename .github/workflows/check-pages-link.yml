name: Check Cloudflare Pages link

on:
  push:
    branches:
      - pages-link-probe-0909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for a possible production deployment
        run: sleep 55
      - name: Probe preview aliases and production fingerprint
        shell: bash
        run: |
          set -u
          report=pages-link-report.txt
          : > "$report"
          for url in \
            'https://pages-link-probe-0909.newtechtransit-vitrine.pages.dev/pages-link-probe.txt' \
            'https://64958b14.newtechtransit-vitrine.pages.dev/pages-link-probe.txt' \
            'https://newtechtransit-vitrine.pages.dev/pages-link-probe.txt'; do
            {
              echo "===== $url ====="
              curl --silent --show-error --location --connect-timeout 10 --max-time 25 \
                --dump-header - "$url" || true
              echo
            } >> "$report" 2>&1
          done

          {
            echo '===== PRODUCTION ROOT ====='
            curl --silent --show-error --location --connect-timeout 10 --max-time 25 \
              --dump-header production-headers.txt \
              https://newtechtransit.com/ -o production.html || true
            cat production-headers.txt 2>/dev/null || true
            echo '----- FINGERPRINTS -----'
            grep -nE 'build-version|padding:clamp\(72px,7vw,104px\)|Pilotez vos opérations|Centralisez vos opérations|Voyons comment|Découvrez comment' production.html || true
            echo '----- SIZE -----'
            wc -c production.html 2>/dev/null || true
          } >> "$report" 2>&1

          cat "$report"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-link-report
          path: |
            pages-link-report.txt
            production.html
            production-headers.txt
          retention-days: 1
